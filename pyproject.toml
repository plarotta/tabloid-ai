[project]
name = "tabloid-ai"
version = "0.1.0"
description = "Automated arXiv paper video pipeline"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "python-dotenv>=1.0",
    # Stage 3: rasterises PDF figures and extracts embedded images when a paper
    # ships no LaTeX source. Pure-python, so it needs no system poppler.
    "pymupdf>=1.24",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.50"]
groq = ["groq>=0.11"]
# Stage 10. Only needed to actually upload - the dry-run path, and its tests,
# import none of this.
youtube = [
    "google-api-python-client>=2.140",
    "google-auth>=2.34",
    "google-auth-oauthlib>=1.2",
]
all = [
    "anthropic>=0.40",
    "openai>=1.50",
    "groq>=0.11",
    "google-api-python-client>=2.140",
    "google-auth>=2.34",
    "google-auth-oauthlib>=1.2",
]

[project.scripts]
pipeline = "pipeline.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# typer.Option() in argument defaults is the framework's required idiom.
"pipeline/cli.py" = ["B008"]
# Demos embed HTML/CSS as string literals, where wrapping at 100 columns hurts
# readability more than it helps. E402: they extend sys.path before importing
# the pipeline package so they can be run directly as scripts.
"demos/*.py" = ["E501", "E402"]

[tool.ruff.format]
indent-style = "tab"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
