# Single source of truth for pipeline behaviour.
# API keys are NEVER stored here - they come from env vars (see .env.example).

fetch:
  categories: [cs.LG, cs.CL, cs.CV, cs.AI, stat.ML]
  # Fallback window when no previous successful run is recorded.
  fallback_window_days: 4
  # arXiv asks for >=3s between requests. Page size capped by their API.
  page_size: 200
  request_delay_seconds: 3.0
  max_retries: 5
  # Hard stop so a bad date window cannot spend unbounded time/money.
  max_papers: 3000

shortlist:
  stage_model: shortlist
  # Abstracts per LLM call. Higher = cheaper, but degrades scoring quality
  # and risks truncated JSON. 20 measured as a reasonable middle.
  batch_size: 20
  shortlist_size: 15
  max_concurrency: 4
  # Papers scoring below this are dropped before ranking regardless of rank.
  min_score: 5.0

enrich:
  # One e-print download per shortlisted paper. arXiv is free; stay polite.
  request_delay_seconds: 3.0
  max_concurrency: 4
  max_figures: 12
  # Fewer enriched papers than this and ranking has too thin a field.
  min_enriched: 5
  # Keep unpacked LaTeX under enrich/<id>/_work/ for debugging (100MB+ per run).
  keep_source: false

rank:
  stage_model: rank
  finalists: 3
  # Papers ranked below this are still kept as substitution candidates
  # when a winner fails enrichment/extraction (spec section 5, failure policy).
  substitution_depth: 6
  # Exclude papers with no usable figure - the format depends on showing them.
  require_figures: true

extract:
  stage_model: extract
  # Cap the paper text sent to the model; appendices rarely carry the results.
  max_fulltext_chars: 90000
  # Swap in the next-ranked substitute when a finalist fails (spec section 5).
  substitute_on_failure: true
  min_digests: 2
  # Drop headline results whose numbers appear nowhere in the paper.
  verify_numbers: true

script:
  stage_model: script
  max_concurrency: 3
  # ~162 words, spread across short hooks and longer explanations. The measured
  # voice is slightly slower than this writing budget; review reports both.
  target_segment_seconds: 65
  min_scenes_per_segment: 9
  max_scenes_per_segment: 11
  # Over budget by more than this and the segment (or the cold open) is sent
  # back for a shorter draft. Asking a model to *only* shorten works where
  # stating a budget alongside everything else never has (D34). One extra call
  # per over-long part, about a cent.
  condense_tolerance: 0.10
  # Passes per part. One took the worst segment 279 -> 242 words against 175:
  # short of the budget but still moving, so it gets one more go.
  condense_max_passes: 2
  # Two beats: tension, then promise. Branding is visible, not read aloud.
  cold_open_seconds: 9
  # Paper one starts immediately. Later papers get one brief, plain signpost.
  transition_seconds: 3
  # Retained for cached scripts; the current wrapper does not write an outro.
  outro_seconds: 10
  words_per_minute: 150

budget:
  # Fail the run if projected spend exceeds this.
  # Per-RUN, cumulative across every invocation against the same run id - so a
  # run that has been re-driven during development carries that history. Raised
  # 2.0 -> 3.0 once hosted TTS was added: narration is ~$0.47 and the 2026-08-07
  # run had already spent $1.49 on repeated extract/script passes, leaving too
  # little headroom to survive a price estimate being slightly wrong. Raised
  # 3.0 -> 4.0 on 2026-08-19: Stage 2 scores every paper in the window, so the
  # cost of a run tracks how long it has been since the last one. A 7.4-day
  # catch-up window is 2,180 papers and ~$2.50, which left nothing for a retry.
  ceiling_usd: 4.0
  # Per-stage soft targets; exceeding one emits a warning, not a failure.
  stage_targets_usd:
    shortlist: 1.0
    rank: 2.0
    extract: 6.0
    script: 3.0
    voice: 1.0

# Model choice per stage. Provider must have a matching entry in pricing.yaml
# and its API key present in the environment.
models:
  shortlist:
    provider: anthropic
    model: claude-haiku-4-5-20251001
    max_tokens: 4096
    temperature: 0.0
  rank:
    provider: anthropic
    model: claude-sonnet-4-5-20250929
    max_tokens: 8192
    temperature: 0.2
  extract:
    provider: anthropic
    model: claude-sonnet-4-5-20250929
    max_tokens: 8192
    temperature: 0.0
  script:
    provider: anthropic
    model: claude-sonnet-4-5-20250929
    max_tokens: 8192
    temperature: 0.6

# Stage 7. See DECISIONS.md D19 for why this is macOS `say` rather than the
# spec's OpenAI default: no OPENAI_API_KEY is configured. Swap `provider` to
# openai (and add a key) for a hosted neural voice - the interface is unchanged.
tts:
  provider: elevenlabs
  # Send neighboring sentences as context so each scene does not reset the read.
  contextual_delivery: true
  # Was eleven_turbo_v2_5, which is the latency-optimised model - nothing here
  # needs low latency, and the owner review heard the difference (D28).
  model: eleven_multilingual_v2
  # ElevenLabs "Bella". Chosen from the samples in
  # runs/_voice_samples/elevenlabs/ after both macOS engines were rejected as
  # robotic (DECISIONS.md D22). Re-sampled 2026-08-13 - see runs/_voice_samples/.
  voice: EXAVITQu4vr4xnSDxMaL
  # Never sent before D28, so every read ran at the voice's flat defaults.
  # Lower stability is what buys variation across a five-minute narration.
  voice_settings:
    stability: 0.40
    similarity_boost: 0.75
    style: 0.30
    use_speaker_boost: true
  # Continuous explanation with longer rests only where a scene requests one.
  scene_gap_seconds: 0.14
  bridge_pause_seconds: 0.30
  words_per_minute: 150

# Stage 8. Engine decision deferred to Phase 4 (see DECISIONS.md D6).
render:
  # Timed typography, mechanism builds and evidence charts, using Pillow/ffmpeg.
  # `classic` retains the original slide and optional Manim renderer.
  visual_style: editorial
  width: 1920
  height: 1080
  fps: 30
  codec: h264
  # Cross-dissolve between scenes; runtime is preserved (see DECISIONS.md D21).
  crossfade_seconds: 0.16
  # Cross-dissolve at the seams between parts. Costs a re-encode of the episode
  # (a filtergraph rules out the stream-copy concat); 0 restores it.
  episode_crossfade_seconds: 0.24
  # Burn the narration into the frame. Built and validated, then turned off on
  # the owner's review of the result (D33). Reserves the bottom ~16% of every
  # slide, which is the part that has to be reconsidered before this goes on.
  captions: false
  # Ken Burns: a slow zoom across each slide. Off for the same reason (D33).
  # Needs crossfade_seconds > 0 - the zoom is a per-slide filter and a hard-cut
  # render has one input for the whole part. Costs render time and file size
  # (2.5x, 1.9x), not money.
  motion: false
  # Animated callouts: a result_callout the model gave comparison parameters for
  # is drawn by manim rather than Pillow (D36). Needs the `manim` extra and
  # crossfade_seconds > 0; falls back to the static callout on anything missing,
  # failing or slow, so turning it on cannot break a run.
  animated_callouts: true
  animate_timeout_seconds: 120
  # Off by default: no licensed track is shipped, and the synthesised fallback
  # reads as hum once audible. Drop a royalty-free file in assets/music/ and set
  # this to true. See DECISIONS.md D21.
  background_music: false
  music_db: -18.0

# Stage 10. Off = dry-run: the stage validates the bundle and writes the exact
# request body it would send to output/upload.json, without calling YouTube.
# Leave it off until the Google Cloud project passes the YouTube API compliance
# audit - until then uploads are locked to private and publishAt is ignored
# (SPEC.md Stage 10, DECISIONS.md D24).
upload:
  enabled: false
  # publishAt only works on a private video; that pairing is the scheduled
  # publish idiom.
  privacy_status: private
  publish_time_local: "12:00"
  timezone: America/New_York
  # 28 = Science & Technology.
  category_id: "28"
  tags:
    - AI
    - machine learning
    - arXiv
    - research papers
    - deep learning
  made_for_kids: false
  language: en
  # If the run finishes after the publish slot, schedule this far out instead of
  # missing the day (DECISIONS.md D24 "Late runs").
  late_publish_grace_minutes: 15
  chunk_size_mb: 8
  max_retries: 5
  poll_timeout_seconds: 900
  poll_interval_seconds: 20
