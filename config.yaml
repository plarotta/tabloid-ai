# Single source of truth for pipeline behaviour.
# API keys are NEVER stored here - they come from env vars (see .env.example).

fetch:
  categories: [cs.LG, cs.CL, cs.CV, cs.AI, stat.ML]
  # Fallback window when no previous successful run is recorded.
  fallback_window_days: 4
  # arXiv asks for >=3s between requests. Page size capped by their API.
  page_size: 200
  request_delay_seconds: 3.0
  max_retries: 5
  # First wait after a 429, doubling per attempt and capped at 5 minutes. A rate
  # limit resets in minutes; the polite delay above is for flaky connections (D40).
  rate_limit_backoff_seconds: 30.0
  # Hard stop so a bad date window cannot spend unbounded time/money.
  max_papers: 3000

shortlist:
  stage_model: shortlist
  # Abstracts per LLM call. Higher = cheaper, but degrades scoring quality
  # and risks truncated JSON. 20 measured as a reasonable middle.
  batch_size: 20
  shortlist_size: 15
  max_concurrency: 4
  # Papers scoring below this are dropped before ranking regardless of rank.
  min_score: 5.0

enrich:
  # One e-print download per shortlisted paper. arXiv is free; stay polite.
  request_delay_seconds: 3.0
  max_concurrency: 4
  max_figures: 12
  # Fewer enriched papers than this and ranking has too thin a field.
  min_enriched: 5
  # Keep unpacked LaTeX under enrich/<id>/_work/ for debugging (100MB+ per run).
  keep_source: false

rank:
  stage_model: rank
  finalists: 3
  # Papers ranked below this are still kept as substitution candidates
  # when a winner fails enrichment/extraction (spec section 5, failure policy).
  substitution_depth: 6
  # Exclude papers with no usable figure - the format depends on showing them.
  require_figures: true

extract:
  stage_model: extract
  # Cap the paper text sent to the model; appendices rarely carry the results.
  max_fulltext_chars: 90000
  # Swap in the next-ranked substitute when a finalist fails (spec section 5).
  substitute_on_failure: true
  min_digests: 2
  # Drop headline results whose numbers appear nowhere in the paper.
  verify_numbers: true

script:
  stage_model: script
  max_concurrency: 3
  # Spec Stage 6: 60-90s per paper segment at ~150 words per minute - but the
  # voice reads at 140-147, so a segment that hits this budget exactly still
  # runs long. 70 is what puts the finished episode at ~4:46 (D34).
  target_segment_seconds: 70
  # Scenes are pace, words are length - the two knobs D29 conflated. A scene is
  # a slide, so more scenes at the same word count is a faster cut, not a longer
  # episode. Episode one ran 7-8 scenes a segment; 6 parked each slide on screen
  # for 13.9s and saved nothing (D34). The max is enforced in code, the min is
  # asked for in the prompt - there is no safe way to invent a scene.
  # Raised 7-8 -> 9-11 after Ep. 6 measured at 9.3s a slide, median, with 14 of
  # 32 slides held past ten seconds. Same words, more cuts: ~7s a slide (D42).
  min_scenes_per_segment: 9
  max_scenes_per_segment: 11
  # Over budget by more than this and the segment (or the cold open) is sent
  # back for a shorter draft. Asking a model to *only* shorten works where
  # stating a budget alongside everything else never has (D34). One extra call
  # per over-long part, about a cent.
  condense_tolerance: 0.10
  # Passes per part. One took the worst segment 279 -> 242 words against 175:
  # short of the budget but still moving, so it gets one more go.
  condense_max_passes: 2
  # Three scenes: the thesis, the most striking number in the episode, and one
  # line handing into the papers. Was 8s and one scene (the series name and the
  # thread) until the owner reviewed Ep. 5 and asked for the punchline first -
  # the first twenty seconds were three framings before a single finding.
  cold_open_seconds: 20
  # One bridge before each paper. Cut 5 -> 3 because a bridge is the second dark
  # card in a row after the segment's own title card, and the owner called the
  # repetition Keynote-like. Shorter and more interruptive is the ask.
  # Back to 6 after Ep. 7: this number is only ever read as a word budget, and at
  # 3 it computed an 8-word cap while the prompt's own worked examples ran 12-14.
  # The model followed the examples, so every bridge overshot a cap nothing
  # enforces. 6 gives 16 words, which is what the examples - and D35's "one clause
  # on what just settled, then name the next" - actually cost. Adds ~9s.
  transition_seconds: 6
  # The synthesis: what the three showed together, then the takeaway. Two
  # scenes. Unused since v5 (which cut the sign-off); the outro is back as an
  # argument rather than a goodbye, and the prompt still forbids a sign-off.
  outro_seconds: 14
  # Measured off Ep. 5: the ElevenLabs "Adam" read is 2.12 words/sec, or 127
  # wpm, against Bella's 2.33-2.45. At 150 every second-budget in this file
  # under-read the finished part by ~13%, which is how a 4:09 projection became
  # a 4:42 episode. 130 is the measured rate rounded, so the budgets convert
  # honestly and the segments come back proportionally shorter - which is what
  # pays for the longer cold open and the outro.
  words_per_minute: 130

budget:
  # Fail the run if projected spend exceeds this.
  # Per-RUN, cumulative across every invocation against the same run id - so a
  # run that has been re-driven during development carries that history. Raised
  # 2.0 -> 3.0 once hosted TTS was added: narration is ~$0.47 and the 2026-08-07
  # run had already spent $1.49 on repeated extract/script passes, leaving too
  # little headroom to survive a price estimate being slightly wrong. Raised
  # 3.0 -> 4.0 on 2026-08-19: Stage 2 scores every paper in the window, so the
  # cost of a run tracks how long it has been since the last one. A 7.4-day
  # catch-up window is 2,180 papers and ~$2.50, which left nothing for a retry.
  ceiling_usd: 4.0
  # Per-stage soft targets; exceeding one emits a warning, not a failure.
  stage_targets_usd:
    shortlist: 1.0
    rank: 2.0
    extract: 6.0
    script: 3.0
    voice: 1.0

# Model choice per stage. Provider must have a matching entry in pricing.yaml
# and its API key present in the environment.
models:
  shortlist:
    provider: anthropic
    model: claude-haiku-4-5-20251001
    max_tokens: 4096
    temperature: 0.0
  rank:
    provider: anthropic
    model: claude-sonnet-4-5-20250929
    max_tokens: 8192
    temperature: 0.2
  extract:
    provider: anthropic
    model: claude-sonnet-4-5-20250929
    max_tokens: 8192
    temperature: 0.0
  script:
    provider: anthropic
    model: claude-sonnet-4-5-20250929
    max_tokens: 8192
    temperature: 0.6

# Stage 7. See DECISIONS.md D19 for why this is macOS `say` rather than the
# spec's OpenAI default: no OPENAI_API_KEY is configured. Swap `provider` to
# openai (and add a key) for a hosted neural voice - the interface is unchanged.
tts:
  provider: elevenlabs
  # Was eleven_turbo_v2_5, which is the latency-optimised model - nothing here
  # needs low latency, and the owner review heard the difference (D28).
  model: eleven_multilingual_v2
  # ElevenLabs "Adam". Episodes 1-5 were "Bella" (EXAVITQu4vr4xnSDxMaL), chosen
  # from the samples in runs/_voice_samples/elevenlabs/ after both macOS engines
  # were rejected as robotic (DECISIONS.md D22). Swapped for episode 5 to hear a
  # different read of the same format; both are from that same sampled set, so
  # reverting is one line. voice_settings below are unchanged from D28's tuning.
  # Measured: Adam reads at 2.12 words/sec (127 wpm) against Bella's 2.33-2.45,
  # so the Stage 6 runtime projection under-reads a finished episode by ~13%.
  voice: pNInz6obpgDQGcFmaJgB
  # Never sent before D28, so every read ran at the voice's flat defaults.
  # Lower stability is what buys variation across a five-minute narration.
  voice_settings:
    stability: 0.40
    similarity_boost: 0.75
    style: 0.30
    use_speaker_boost: true
  # Small per-scene nudges to the settings above, by what the scene is doing:
  # the opening and a headline number get a little more lift, the caveat scene
  # settles. D21 named the monotony - one voice, one pace, no variation across
  # five minutes - and this is the Stage 7 half of the fix (D42).
  vary_by_scene: true
  # A beat at every scene change, added to the clip itself.
  scene_gap_seconds: 0.35
  # The rest after a bridge line, before the next paper starts. Cut 1.0 -> 0.35
  # with the bridge itself: a one-second hold on a dark card is most of what
  # made the seams feel like a slide deck (owner, Ep. 5 review).
  bridge_pause_seconds: 0.35
  words_per_minute: 150

# Stage 8. Engine decision deferred to Phase 4 (see DECISIONS.md D6).
render:
  width: 1920
  height: 1080
  fps: 30
  codec: h264
  # Cross-dissolve between scenes; runtime is preserved (see DECISIONS.md D21).
  crossfade_seconds: 0.4
  # Cross-dissolve at the seams between parts. Costs a re-encode of the episode
  # (a filtergraph rules out the stream-copy concat); 0 restores it.
  episode_crossfade_seconds: 0.6
  # Burn the narration into the frame. Built and validated, then turned off on
  # the owner's review of the result (D33). Reserves the bottom ~16% of every
  # slide, which is the part that has to be reconsidered before this goes on.
  captions: false
  # Ken Burns: a slow zoom across each slide. Off for the same reason (D33).
  # Needs crossfade_seconds > 0 - the zoom is a per-slide filter and a hard-cut
  # render has one input for the whole part. Costs render time and file size
  # (2.5x, 1.9x), not money.
  motion: false
  # Animated callouts: a result_callout the model gave comparison parameters for
  # is drawn by manim rather than Pillow (D36). Needs the `manim` extra and
  # crossfade_seconds > 0; falls back to the static callout on anything missing,
  # failing or slow, so turning it on cannot break a run.
  animated_callouts: true
  animate_timeout_seconds: 120
  # Staged reveals on the ordinary slide types: bullets arrive a row at a time,
  # a headline number lands on a rule already drawn, a figure's caption follows
  # the figure. Ep. 6 had 3 moving scenes out of 32 because motion was gated to
  # the manim comparison templates; this is what covers the other twenty-odd.
  # Pillow and ffmpeg only - no manim - so it works on the Linux runner, which
  # has never successfully drawn a callout (D37). Falls back to the still on any
  # failure, and needs crossfade_seconds > 0 for the same reason motion does.
  slide_reveals: true
  # A generated image behind each title card (D39). ~$0.06 an image and four
  # per episode; cached in runs/<id>/render/_backdrops so re-rendering is free.
  # Falls back to the flat card without OPENAI_API_KEY or on any failure.
  title_backdrops: true
  backdrop_model: gpt-image-1
  # Off by default: no licensed track is shipped, and the synthesised fallback
  # reads as hum once audible. Drop a royalty-free file in assets/music/ and set
  # this to true. See DECISIONS.md D21.
  background_music: false
  music_db: -18.0

# Stage 10. Off = dry-run: the stage validates the bundle and writes the exact
# request body it would send to output/upload.json, without calling YouTube.
# Leave it off until the Google Cloud project passes the YouTube API compliance
# audit - until then uploads are locked to private and publishAt is ignored
# (SPEC.md Stage 10, DECISIONS.md D24).
upload:
  enabled: false
  # publishAt only works on a private video; that pairing is the scheduled
  # publish idiom.
  privacy_status: private
  publish_time_local: "12:00"
  timezone: America/New_York
  # 28 = Science & Technology.
  category_id: "28"
  tags:
    - AI
    - machine learning
    - arXiv
    - research papers
    - deep learning
  made_for_kids: false
  language: en
  # If the run finishes after the publish slot, schedule this far out instead of
  # missing the day (DECISIONS.md D24 "Late runs").
  late_publish_grace_minutes: 15
  chunk_size_mb: 8
  max_retries: 5
  poll_timeout_seconds: 900
  poll_interval_seconds: 20
